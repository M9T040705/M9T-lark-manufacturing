# 生产/本地一体化编排：MySQL8 + Redis7 + NestJS API + Nginx Web
# 所有敏感值与域名从同目录 .env 读取（参考 .env.production.example）。
# 一键启动：docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flybook}
      MYSQL_USER: ${MYSQL_USER:-flybook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flybook123}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-flybook}:${MYSQL_PASSWORD:-flybook123}@mysql:3306/${MYSQL_DATABASE:-flybook}?charset=utf8mb4"
      # JWT_SECRET 必须在 .env 中显式提供强随机值，缺失则拒绝启动（杜绝默认弱密钥）
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（可用 openssl rand -hex 32 生成）}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # 首次启动是否写入演示数据：体验设 true，正式生产设 false
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql_data:
  redis_data:
